services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Omsk
    ports:
      - "127.0.0.1:55432:5432"   # 5432 на хосте занят SSH-туннелем
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    # если встроенный DNS docker не резолвит внешние имена — укажите шлюз вашей
    # сети в DNS_SERVER (.env); по умолчанию публичный резолвер
    dns:
      - ${DNS_SERVER:-1.1.1.1}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TIMESHEET_PATH: /srv/data/TIMESHEET.md
      AUTO_IMPORT_ON_EMPTY: "1"
      TRACKER_TOKEN_FILE: /srv/secrets/tracker_token
      TRACKER_ORG_ID: ${TRACKER_ORG_ID:-}
      TZ: Asia/Omsk
    ports:
      - "127.0.0.1:${APP_PORT:-8787}:8080"
    volumes:
      # обновляются без пересборки образа
      - ./TIMESHEET.md:/srv/data/TIMESHEET.md:ro
      - ./timesheet_to_tracker.py:/srv/app/timesheet_to_tracker.py:ro
      # токен Трекера (не задан путь — смонтируется /dev/null, синк откажется с сообщением)
      - ${TRACKER_TOKEN_HOST_FILE:-/dev/null}:/srv/secrets/tracker_token:ro
      # список проектов табеля (локальный; /dev/null — файл пуст, импорт подскажет формат)
      - ${PROJECTS_FILE:-/dev/null}:/srv/app/projects.json:ro
      # файлы вложений зеркала
      - ./data/attachments:/srv/data/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
